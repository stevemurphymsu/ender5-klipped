# This file contains common pin mappings for the BIGTREETECH Manta E3EZ
# To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" "8 MHz crystal"
# and "USB (on PA11/PA12)" or "CAN bus (on PB12/PB13)".

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: PA14
dir_pin: !PA10
enable_pin: !PA13
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC4
position_endstop: 235
position_max: 235
homing_speed: 60

[stepper_y]
step_pin: PC8
dir_pin: !PA15
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB0
position_endstop: 235
position_max: 235
homing_speed: 60

[stepper_z]
step_pin: PD2
dir_pin: PD4
enable_pin: !PD3
microsteps: 16
rotation_distance: 4 
#endstop_pin: PC6
endstop_pin: probe: z_virtual_endstop
position_max: 300

[safe_z_home]                         # enable for BLTouch
home_xy_position: 150, 150
speed: 100
z_hop: 10
z_hop_speed: 5

[bltouch]
sensor_pin: PA6
control_pin: PA7
probe_with_touch_mode: True
stow_on_each_sample: False
#z_offset: 3.495
x_offset = -40.5 ##!! Measure and change for your own printer!!
y_offset = -14   ##!! Measure and change for your own printer!!
speed: 10
samples: 3
sample_retract_dist: 5.0              # Can be set lower, example 2.5 depending on height of bltouch from bed
lift_speed: 40
samples_tolerance_retries: 3
speed: 10
samples: 2

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 25, 6
mesh_max: 180,180
probe_count: 3,3
probe_count: 5, 3

[endstop_phase]

[extruder]
max_extrude_only_distance: 100.0
max_extrude_cross_section: 15
step_pin: PD5
dir_pin: PD6
enable_pin: !PB3
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB11 #HE0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA4 #TH0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: -100
max_temp: 250
pressure_advance: 0.05
max_extrude_cross_section: 7.5

[fan]
pin: PB15

[heater_fan heatbreak_cooling_fan]
pin: PA8
heater: extruder

#[heater_fan fan1]
#pin: PB15

#[heater_fan fan2]
#pin: PB14

#material_0]
#switch_pin: PC5

#[extruder1]
