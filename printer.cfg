#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: -100
max_temp: 130

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100


[input_shaper]
#shaper_type_x = mzv
#shaper_freq_x = 64.2
#shaper_type_y = mzv
#shaper_freq_y = 64.2


[firmware_retraction]
retract_length: 0.5
retract_speed: 4
unretract_extra_length: 0
unretract_speed: 20 

[bed_screws]
screw1: 35,35
screw1_name: front left screw
screw2: 35,195
screw2_name: rear left screw
screw3: 195,195
screw3_name: rear right screw
screw4: 195,35
screw4_name: front right screw

[screws_tilt_adjust]
screw1: 75,35
screw1_name: front left screw
screw2: 75,192
screw2_name: rear left screw
screw3: 230,192
screw3_name: rear right screw
screw4: 230,35
screw4_name: front right screw
horizontal_move_z: 5
speed: 50
screw_thread: CW-M4

[filament_switch_sensor switch_sensor]
switch_pin: ^PB1
pause_on_runout: False
runout_gcode:
 PAUSE # [pause_resume] is required in printer.cfg 
