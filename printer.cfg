# This file contains common pin mappings for the BIGTREETECH Manta E3EZ
# To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" "8 MHz crystal"
# and "USB (on PA11/PA12)" or "CAN bus (on PB12/PB13)".

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: PA14
dir_pin: !PA10
enable_pin: !PA13
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC4
position_endstop: 220
position_max: 220
homing_speed: 60

[stepper_y]
step_pin: PC8
dir_pin: !PA15
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB0
position_endstop: 220
position_max: 220
homing_speed: 60

[stepper_z]
step_pin: PD2
dir_pin: PD4
enable_pin: !PD3
microsteps: 16
rotation_distance: 4 
#endstop_pin: PC6
endstop_pin: probe: z_virtual_endstop
position_min: -20
position_max: 300

[safe_z_home]                         # enable for BLTouch
home_xy_position: 150, 150
speed: 100
z_hop: 10
z_hop_speed: 5

[bltouch]
sensor_pin: PA6
control_pin: PA7
probe_with_touch_mode: True
stow_on_each_sample: False
#z_offset: 3.495
x_offset = -40.5 ##!! Measure and change for your own printer!!
y_offset = -14   ##!! Measure and change for your own printer!!
speed: 10
samples: 3
sample_retract_dist: 5.0              # Can be set lower, example 2.5 depending on height of bltouch from bed
lift_speed: 40
samples_tolerance_retries: 3
speed: 10
samples: 2

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 35, 6
mesh_max: 150, 158
probe_count: 5, 3
mesh_pps: 2, 3
algorithm: bicubic
bicubic_tension: 0.2

[endstop_phase]


[extruder]
max_extrude_only_distance: 100.0
max_extrude_cross_section: 30
step_pin: PD5
dir_pin: PD6
enable_pin: !PB3
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 3.4334
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB11 #HE0
min_temp: -100
max_temp: 300
pressure_advance: 0.05
sensor_type: MAX31865 # One of "MAX6675", "MAX31855", "MAX31856", or "MAX31865".
sensor_pin: PB5
spi_speed: 4000000
spi_software_miso_pin: PC11
spi_software_mosi_pin: PC12
spi_software_sclk_pin: PC10
rtd_nominal_r: 1000 # Change to 1000 for PT1000 sensors
rtd_reference_r: 4300 # Change to 4300 for PT1000 sensors
rtd_num_of_wires: 2 # Adjust to 2, 3, or 4
#rtd_use_50Hz_filter: True # Recommended for regions with 50Hz mains power

[fan]
pin: PB15

[heater_fan heatbreak_cooling_fan]
pin: PA8
heater: extruder

#[heater_fan fan1]
#pin: PB15

#[heater_fan fan2]
#pin: PB14

#material_0]
#switch_pin: PC5

